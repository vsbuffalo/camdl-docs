on:
  push:
    branches: [main]
  workflow_dispatch:

name: Build and deploy Quarto site

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout camdl-docs
        uses: actions/checkout@v5

      - name: Checkout camdl (sibling)
        uses: actions/checkout@v5
        with:
          repository: vsbuffalo/camdl
          path: camdl-src

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: camdl-src/rust

      - name: Build and install camdl
        run: cargo install --path camdl-src/rust/crates/cli --locked

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Expose uv venv to Quarto
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chapters currently inject a hardcoded "/Users/vsb/.../camdl-book"
          # onto sys.path to import from _lib/. That path doesn't exist on
          # the runner, so we make _lib importable via PYTHONPATH instead.
          # Remove once chapters resolve _lib via Path(__file__) or similar.
          PYTHONPATH: ${{ github.workspace }}
