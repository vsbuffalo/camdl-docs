[model]
camdl = "sir_binomial.camdl"
scenario = "baseline"
fit_seeds = 42

[data.observations]
in_bed = "data/boarding_school.tsv"

[estimate]
beta  = { bounds = [0.5, 5.0], start = 1.5 }
gamma = { bounds = [0.1, 1.0], start = 0.4 }

[fixed]
N0 = 763
I0 = 5

[stages.scout]
method = "if2"
chains = 48
particles = 1000
iterations = 150
cooling = 0.9

[stages.refine]
method = "if2"
chains = 12
particles = 3000
iterations = 200
cooling = 0.95
starts_from = "scout"
