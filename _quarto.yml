project:
  type: book
  output-dir: _site

book:
  title: "camdl"
  subtitle: "Compartmental Model Description Language"
  author: "Vince Buffalo"
  date: "2026"
  repo-url: https://github.com/vsbuffalo/camdl-book
  repo-actions: [edit]
  page-navigation: true
  page-footer:
    left: "© 2026 Vince Buffalo. Supported by the Institute for Disease Modeling, Bill & Melinda Gates Foundation."
    right: "License: [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
  sidebar:
    collapse-level: 2
  chapters:
    - index.qmd
    - part: "Getting Started"
      chapters:
        - guide/getting-started.qmd
        - guide/experiments.qmd
        - guide/scenarios.qmd
        - guide/dimensions.qmd
        - guide/fitting-data/report.qmd
        - guide/fitting-data/model_comparison.qmd
    - part: "Inference"
      chapters:
        - inference/likelihood.qmd
        - inference/algorithms.qmd
    - part: "Vignettes"
      chapters:
        - vignettes/he2010.qmd
        - vignettes/malaria.qmd
        - vignettes/model-comparison.qmd
        - vignettes/spatial-inference.qmd
        - vignettes/sampler-comparison.qmd
        - vignettes/diagnostics.qmd
    - part: "Reference"
      chapters:
        - language/spec.qmd
        - language/data-spec.qmd
        - reference/features.qmd
        - reference/inference-spec.qmd
        - reference/ir-spec.qmd
        - reference/runtimes.qmd
        - reference/design.qmd

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    syntax-definitions:
      - _extensions/camdl/camdl.xml
    code-copy: true
    include-after-body:
      - text: '<script src="cli-copy.js"></script>'
    toc: true
    toc-depth: 3
    number-sections: false
    code-annotations: below

filters:
  - camdl
  - _filters/ansi.lua

execute:
  freeze: auto
