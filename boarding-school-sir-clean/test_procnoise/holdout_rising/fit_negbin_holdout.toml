# NegBin-obs SIR, trained on days 0-3 (rising onset), validated on days 4-13.
[model]
camdl = "../../boarding_school_sir_negbin.ir.json"
output_dir = "results/negbin_holdout_rising"
scenario = "baseline"

[data.observations]
in_bed = "train.tsv"

[config]
backend = "chain_binomial"
dt = 1.0

[estimate]
beta  = { bounds = [0.5, 5.0],   start = 1.9 }
gamma = { bounds = [0.1, 1.0],   start = 0.65 }
k     = { bounds = [1.0, 500.0], start = 10.0 }

[fixed]
N0 = 763
I0 = 5

[stages.scout]
method     = "if2"
chains     = 48
particles  = 2000
iterations = 250
cooling    = 0.9

[stages.refine]
method      = "if2"
chains      = 12
particles   = 4000
iterations  = 400
cooling     = 0.98
starts_from = "scout"
