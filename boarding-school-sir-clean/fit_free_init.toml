[model]
camdl = "boarding_school_sir_init.ir.json"
output_dir = "results/sir_free_init"
scenario = "baseline"

[data.observations]
in_bed = "data/in_bed.tsv"

[config]
backend = "chain_binomial"
dt = 1.0

[estimate]
beta   = { bounds = [0.5, 5.0],  start = 1.5 }
gamma  = { bounds = [0.1, 1.0],  start = 0.4 }
# I(0) and R(0) estimated as initial-value-problem (ivp) parameters —
# they set the starting distribution, not a time-varying process.
I0     = { bounds = [1.0, 20.0], start = 5.0,   ivp = true, rw_sd = 0.10 }
R_init = { bounds = [0.0, 400.0], start = 100.0, ivp = true, rw_sd = 5.0 }

[fixed]
N0 = 763

[stages.scout]
method     = "if2"
chains     = 96
particles  = 2000
iterations = 500
cooling    = 0.9

[stages.refine]
method      = "if2"
chains      = 12
particles   = 4000
iterations  = 800
cooling     = 0.98
starts_from = "scout"
