[model]
camdl = "ross_macdonald.camdl"
output_dir = "results"
scenario = "baseline"

[data.observations]
slide_positivity = "ross_macdonald_obs.tsv"

[config]
backend = "chain_binomial"
dt = 1.0

# Estimate the 6 transmission/recovery parameters.
# Priors are weakly informative log-normals centered near truth.
[estimate.a]
bounds = [0.1, 1.0]
start  = 0.4
prior  = { dist = "log_normal", mu = -0.7, sigma = 0.5 }

[estimate.b_h]
bounds = [0.05, 0.8]
start  = 0.25
prior  = { dist = "uniform" }

[estimate.b_v]
bounds = [0.05, 0.5]
start  = 0.15
prior  = { dist = "uniform" }

[estimate.r]
bounds = [0.005, 0.5]
start  = 0.04
prior  = { dist = "log_normal", mu = -3.0, sigma = 0.5 }

[estimate.sigma_v]
bounds = [0.05, 0.5]
start  = 0.08
prior  = { dist = "log_normal", mu = -2.3, sigma = 0.5 }

[estimate.mu_v]
bounds = [0.01, 0.3]
start  = 0.08
prior  = { dist = "log_normal", mu = -2.3, sigma = 0.5 }

# Fix observation and population parameters at truth.
[fixed]
rho_sens = 0.85
rho_spec = 0.95
H0       = 1000
M0       = 10000
I_h0     = 50
N_tested = 200

# Scout: IF2 to find the MLE basin.
[stages.scout]
method     = "if2"
chains     = 24
particles  = 1000
iterations = 200
cooling    = 0.9

# PMMH: posterior sampling from the scout MLE.
[stages.pmmh]
method     = "pmmh"
chains     = 4
particles  = 1000
iterations = 2000
burn_in    = 500
thin       = 2
starts_from = "scout"
