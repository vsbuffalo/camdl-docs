# Preliminary dt-sensitivity check vs poisson_fixed_ic.toml: identical
# config except dt = 0.1 instead of dt = 1.0. If the headline MLE
# (β=1.98, γ=0.65) shifts toward the pomp-canonical (β≈1.5, γ≈0.5) at
# this finer step, the day-1 binomial step in chain_binomial is the
# source of the rate inflation. R₀ = β/γ should be roughly preserved
# either way (ratios survive discretization, absolute rates don't).

[model]
camdl      = "../models/boarding_school_sir.camdl"
output_dir = "../results/poisson_fixed_ic_dt01"
scenario   = "baseline"

[data.observations]
in_bed = "../data/in_bed.tsv"

[config]
backend = "chain_binomial"
dt      = 0.1

[estimate]
beta  = { bounds = [0.5, 5.0], start = 1.5 }
gamma = { bounds = [0.1, 1.0], start = 0.4 }

[fixed]
N0 = 763
I0 = 3

[stages.scout]
algorithm  = "if2"
backend    = "chain_binomial"
chains     = 48
particles  = 2000
iterations = 250
cooling    = 0.9

[stages.refine]
algorithm   = "if2"
backend     = "chain_binomial"
chains      = 12
particles   = 4000
iterations  = 400
cooling     = 0.98
starts_from = "scout"

[stages.refine.gate]
a_thresh = 1.05
