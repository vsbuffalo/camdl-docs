# The "what if we'd reached for the default dt = 1?" companion to
# poisson_fixed_ic_synth.toml. Identical in every respect except dt:
# same synthetic data (data/synthetic.tsv, generated at dt = 0.1 from
# the truth in fits/truth.toml), same IF2 budget, same [fixed] block.
#
# Expectation, and the chapter's point: fitting at the coarse default
# dt = 1.0 recovers a *biased* estimate — γ̂ comes out noticeably above
# the truth γ = 0.33 — because at γ·dt ≈ 0.3 the chain-binomial is a
# meaningfully different stochastic process from the SIR. The post-fit
# Richardson dt-check on this synthetic fit is borderline (the 14-obs
# outbreak isn't quite enough signal to push it over τ); on the real
# data, where the fitted γ̂ is roughly twice as fast, it fails outright.

[model]
camdl      = "../models/boarding_school_sir.camdl"
output_dir = "../results/sir_synthetic_dt1"

[data.observations]
in_bed = "../data/synthetic.tsv"

[config]
backend = "chain_binomial"
dt      = 1.0

[estimate]
beta  = { bounds = [0.5, 5.0], start = 1.5 }
gamma = { bounds = [0.1, 1.0], start = 0.4 }

[fixed]
N0 = 763
I0 = 5

[stages.scout]
algorithm  = "if2"
backend    = "chain_binomial"
chains     = 48
particles  = 2000
iterations = 250
cooling    = 0.9

[stages.refine]
algorithm   = "if2"
backend     = "chain_binomial"
chains      = 12
particles   = 4000
iterations  = 400
cooling     = 0.98
starts_from = "scout"

[stages.refine.gate]
a_thresh = 1.05
