# Model-comparison arm: PMMH on the CONSTANT-rho model (no reporting ramp).
# Same priors and sampler as covid_wa_pmmh.toml; the only structural difference
# is rho constant instead of rho(t). `camdl compare` against the rho(t) fit
# quantifies whether the reporting ramp is necessary (expected: yes).
[model]
camdl      = "../models/seed_timing_const_rho_prior.camdl"
output_dir = "../results/covid_wa_pmmh_constrho"

[data.observations]
cases = "../data/covid_wa_growth.tsv"

[config]
backend = "chain_binomial"
dt      = 1

[estimate]
beta   = { bounds = [0.001, 5.0],  start = 0.6,  prior = { log_normal = { mu = -0.92, sigma = 0.4 } } }
gamma  = { bounds = [0.01, 1.0],   start = 0.18, prior = { log_normal = { mu = -1.97, sigma = 0.4 } } }
tau    = { bounds = [0.0, 45.0],   start = 23.0, prior = { uniform = { lower = 0.0, upper = 45.0 } } }
lambda = { bounds = [0.0, 100.0],  start = 2.0,  prior = { exponential = { rate = 0.5 } } }
rho    = { bounds = [0.0, 1.0],    start = 0.4,  prior = { beta = { alpha = 2.0, beta = 3.0 } } }
k      = { bounds = [0.1, 1000.0], start = 20.0, prior = { log_normal = { mu = 3.0, sigma = 1.0 } } }

[fixed]
N0 = 1000000
w  = 5.0

[stages.posterior]
algorithm   = "pmmh"
backend     = "chain_binomial"
chains      = 4
particles   = 800
iterations  = 15000
burn_in     = 3000
thin        = 5
init_method = "single"
adapt       = true
